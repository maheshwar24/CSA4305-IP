<!DOCTYPE html>
<html>
<head>
<title>Retail Website</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#f5f5f5;
}

header{
background:#222;
color:white;
text-align:center;
padding:25px;
}

nav{
display:flex;
justify-content:center;
gap:30px;
background:#0077b6;
padding:15px;
}

nav a{
color:white;
text-decoration:none;
}

.container{
display:flex;
gap:20px;
padding:30px;
}

.card{
flex:1;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px gray;
}


footer{
background:#222;
color:white;
text-align:center;
padding:15px;
}


@media(max-width:600px){

.container,nav{
flex-direction:column;
align-items:center;
}

}

</style>
</head>

<body>

<header>
<h1>Retail Store</h1>
<p>Online Shopping Website</p>
</header>


<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Offers</a>
<a href="#">Contact</a>
</nav>


<div class="container">

<div class="card">
<h2>Products</h2>
<p>Electronics</p>
<p>Fashion</p>
</div>


<div class="card">
<h2>Welcome</h2>
<p>Shop your favourite products easily.</p>
</div>

</div>


<footer>
© 2026 Retail Store
</footer>


</body>
</html>
